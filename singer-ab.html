<!doctype html>
<!-- The singer's A/B page: today's voice against the new one on fixed lines. Served by the dev server only, not a build input. See src/singerPreview/ab.ts. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singer A/B</title>
    <style>
      /* one narrow column of controls; the sing button is the one thing that stands out */
      :root {
        --paper: #f6f3f9;
        --card: #ffffff;
        --ink: #1c1724;
        --dim: #5f5770;
        --line: #ddd5e6;
        --accent: #b8156f;
        --on-accent: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #121017;
          --card: #1c1824;
          --ink: #eee9f5;
          --dim: #a89fb8;
          --line: #352d42;
          --accent: #ff6cc6;
          --on-accent: #1b0b15;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --paper: #121017;
        --card: #1c1824;
        --ink: #eee9f5;
        --dim: #a89fb8;
        --line: #352d42;
        --accent: #ff6cc6;
        --on-accent: #1b0b15;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: grid;
        gap: 18px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        text-wrap: balance;
      }
      p {
        margin: 0;
      }
      .dim {
        color: var(--dim);
      }
      .group {
        display: grid;
        gap: 8px;
      }
      .label {
        font-size: 0.85rem;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
      }
      .pill {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 16px;
        min-height: 44px;
        cursor: pointer;
      }
      .pill[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      textarea,
      select {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        min-height: 44px;
      }
      #all {
        background: var(--accent);
        color: var(--on-accent);
        border: 0;
        border-radius: 999px;
        padding: 12px 32px;
        min-height: 52px;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        justify-self: start;
      }
      button:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .lines {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }
      .lines li {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        display: grid;
        gap: 8px;
      }
      .lines li[data-on] {
        border-color: var(--accent);
      }
      .said {
        font-size: 1.15rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="group">
        <h1>Singer A/B</h1>
        <p class="dim">A is the voice on the site now, B is the new one. Same lines, same notes.</p>
      </div>
      <button id="all" type="button">▶ All lines, A then B</button>
      <p id="now" class="dim" aria-live="polite">&nbsp;</p>
      <div class="group">
        <span class="label">Voice</span>
        <div class="row">
          <button class="pill" type="button" data-preset="clean">Clean</button>
          <button class="pill" type="button" data-preset="breathy">Breathy</button>
          <button class="pill" type="button" data-preset="glitchy">Glitchy</button>
        </div>
      </div>
      <div class="group">
        <span class="label">Delivery</span>
        <div class="row">
          <button class="pill" type="button" data-mode="sung">Sung</button>
          <button class="pill" type="button" data-mode="spoken">Spoken</button>
        </div>
      </div>
      <ol id="lines" class="lines"></ol>
    </main>
    <script type="module" src="/src/singerPreview/ab.ts"></script>
  </body>
</html>
