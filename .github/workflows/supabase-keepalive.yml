name: Supabase Keepalive

# Supabase pauses a free project after ~7 days without activity, and a paused project takes the
# whole site down. Real traffic normally counts as activity; this is the backstop for quiet weeks.
#
# ⚠️ Runs every 3 days, not weekly. A 7-day ping against a 7-day threshold has zero margin, and
# GitHub's scheduled runs are best-effort — they are delayed under load and are disabled entirely
# after 60 days of repo inactivity. Three days survives a missed run.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # ⚠️ This step used to be `curl -s -o /dev/null -w "%{http_code}"` and nothing else,
          # which exits 0 for ANY http response — 401, 404, 500 included. A keepalive that
          # cannot fail is not a keepalive: it would have reported green every Monday while the
          # project quietly paused, and the first anyone knew of it would be the site being down.
          # So: capture the status, print it, and fail on anything that is not 2xx.
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/leaderboard?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}") || {
              echo "::error::Could not reach Supabase at all (curl transport error)."
              exit 1
            }
          echo "HTTP $code"
          case "$code" in
            2*) echo "Project is awake." ;;
            401|403)
              echo "::error::Auth rejected (HTTP $code). The anon key secret is probably stale —"
              echo "::error::the project is NOT being kept alive."
              head -c 300 /tmp/body.txt; exit 1 ;;
            *)
              echo "::error::Unexpected HTTP $code — the project is NOT being kept alive."
              head -c 300 /tmp/body.txt; exit 1 ;;
          esac
