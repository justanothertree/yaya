name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # ⚠️ Plain `npm ci`, NOT `npm ci || npm i`.
      #
      # `npm ci` exists to verify that package-lock.json still matches package.json, and it is
      # the only thing checking that. Falling back to `npm i` turns that check into a shrug: on
      # lockfile drift it silently resolves different versions, rewrites the lock in CI, and
      # DEPLOYS the result. The one workflow that publishes to production was the one not
      # enforcing it, while build.yml — which ships nothing — used strict `npm ci`.
      #
      # Verified before removing: the lockfile is in sync (deps and devDeps both match), `npm ci`
      # succeeds locally, and build.yml already proves plain `npm ci` works in this CI. So the
      # fallback was dead weight that could only ever fire in the case worth knowing about.
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LEADERBOARD_TABLE: ${{ secrets.VITE_LEADERBOARD_TABLE }}
          VITE_LEADERBOARD_NAME_COLUMN: ${{ secrets.VITE_LEADERBOARD_NAME_COLUMN }}
          # Multiplayer WS endpoint (Render): set this secret to your wss:// service URL
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
