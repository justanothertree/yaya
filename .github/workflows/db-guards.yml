name: db guards

# Runs supabase/tests/visibility-guards.sql, then supabase/tests/chronicle-daily-flow.sql, against a
# throwaway local database on every push.
#
# ⚠️ NO PRODUCTION CREDENTIALS ARE USED OR WANTED HERE. The database this builds is created by
# `supabase start`, lives for the length of the job and is thrown away. Giving Actions a
# connection string to the live project would make every workflow run a thing that can read
# members' data, which is a much larger decision than running a test.
#
# ⚠️ AND IT CANNOT PASS BY TESTING NOTHING. A freshly migrated database has no members, no admin
# and no logs, so every check that needs a session would succeed against an empty set and report
# a green zero. `supabase/seed.sql` supplies the fixtures, and the guard file refuses to run
# without them — see its block 0, and block L, which refuses its own zeros unless an opted-in
# minor is reaching their friend with something. The seed carries a second circuit log purely so
# that block has a non-zero to measure against; the comment on it says so, in case it ever looks
# redundant.

on:
  push:
  pull_request:
  workflow_dispatch:

# read-only: this job checks out code and talks to a local container, nothing else
permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ⚠️ NEVER EDIT A MIGRATION PRODUCTION HAS ALREADY APPLIED. A migration file is not source
      # code that can be corrected; it is the record of an event, and the database it describes
      # has moved on. The fix goes in a new timestamped migration.
      #
      # `supabase/migrations/applied.md5` holds, per file, the md5 of the statement production
      # actually ran — committed rather than fetched, because this job has no credentials and
      # must not be given any (see the note at the top about what a connection string here would
      # mean). The script recomputes each file's body and compares.
      #
      # ⚠️ IT IS A PIN, NOT AN EXEMPTION, and that distinction is the whole design. Eleven files
      # already diverge: three gained re-run guards after being applied — including the two the
      # step below depends on — and eight predate the body-md5 protocol existing. A manifest that
      # merely listed those eleven as "allowed to differ" would hand a permanent licence to
      # exactly the files most likely to be edited again. Instead the line pins the one text that
      # is allowed, so a second edit to a diverging file fails like any other.
      #
      # ⚠️ IT ALSO FAILS ON A MIGRATION FILE WITH NO LINE IN THE MANIFEST, from 4 Nov. That was
      # reported with an exit code of 0 to begin with, so THIS STEP would have gone green over a
      # migration applied without its hash being recorded — the suite behind it was the stricter
      # of the two, which is the wrong way round for the thing with the word "check" on it. The
      # schema baseline is the one exception and is named in the script, not inferred.
      - name: Check every migration file matches production's record
        run: node scripts/migration-md5.mjs

      - name: Check the migrations can build the schema
        run: |
          if ! grep -rqiE 'create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?("?public"?\.)?"?profiles"?([[:space:](]|$)' supabase/migrations/; then
            echo "::error title=No schema baseline::supabase/migrations cannot build this schema from scratch — nothing in it creates public.profiles, so the migrations that ALTER it will fail. Generate a baseline once: supabase db dump --linked --schema public,finance -f supabase/migrations/00000000000000_baseline.sql (see this workflow's comments for what then happens to the migrations already here)"
            exit 1
          fi

      # ⚠️ PINNED. `version: latest` means a CLI release can change what this job does without a
      # commit here, which is the same rot a floating dependency always is — and for a job whose
      # whole purpose is to notice changes, a moving part nobody chose is the wrong kind.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start a throwaway database
        run: supabase start

      # applies [db.seed] sql_paths: privileges, extensions, the dump, triggers, then seed
      - name: Apply migrations and seed
        run: supabase db reset

      # ⚠️ THE CHRONICLE FLOW RUNS IN THIS STEP, NOT A STEP OF ITS OWN, because DB_URL is worked out
      # here and a shell variable does not outlive the step that set it. It acts as a seeded
      # member on the real functions — start, switch, a note, a count, the read-back, a goal, stop,
      # and a second member refused at each — inside a transaction that rolls back, like the guards.
      # It runs AFTER them and only if they pass (bash -e), so a broken guard is never hidden behind
      # a later green. What it does NOT cover: Supabase Auth and PostgREST. It sets the role and the
      # JWT claim itself, so a browser session is still a separate kind of evidence.
      - name: Run the visibility guards and the chronicle flow
        run: |
          DB_URL="$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          # ON_ERROR_STOP turns the suite's own RAISE into a failed job
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/visibility-guards.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/chronicle-daily-flow.sql

      - name: Stop the database
        if: always()
        run: supabase stop --no-backup || true
