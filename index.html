<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="robots" href="/robots.txt" />
    <!-- ⚠️ mirrored by site.title in src/config/site.ts, which is what the app restores when
         you navigate back to home. Change both together. -->
    <title>Evan Cook — Portfolio (Resume, Projects, Snake)</title>
    <meta
      name="description"
      content="Evan Cook's portfolio: resume, selected projects, a playable Snake game, and a contact form."
    />
    <link rel="canonical" href="https://evancook.dev/" />
    <meta property="og:url" content="https://evancook.dev/" />
    <meta property="og:title" content="Evan Cook — Portfolio" />
    <meta
      property="og:description"
      content="Resume, projects, a playable Snake game, and a contact form."
    />
    <meta property="og:type" content="website" />
    <!-- Open Graph image: path matches current asset in /public -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="theme-color" content="#0b0f19" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- deploy: supabase env wired -->
    <!--
      Cloudflare Web Analytics: page views without cookies, fingerprinting or personal data, so
      it needs no consent banner and doesn't conflict with keeping visitors' data private.

      The token is PUBLIC by design — it ships inside this page to every visitor, and is not a
      credential. It identifies which site is reporting, nothing more; the account-reading token
      is a different thing entirely and stays on the relay.
    -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "ca7ac2095efe4ad1b1f6b2ea747192d6"}'
    ></script>
  </body>
</html>
