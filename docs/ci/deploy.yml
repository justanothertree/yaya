# ⚠️ PARKED, NOT LIVE. Copy this over .github/workflows/deploy.yml yourself.
#
# This session's token has no `workflow` scope, so GitHub refuses the push outright:
#
#   ! [remote rejected] main -> main (refusing to allow an OAuth App to create or update
#     workflow `.github/workflows/deploy.yml` without `workflow` scope)
#
# Same reason db-guards.yml beside this file is parked. The change is one job and one `needs:`.
#
# ── what it fixes ───────────────────────────────────────────────────────────────────────────
#
# ⚠️ THE DEPLOY DID NOT WAIT FOR LINT OR TESTS. `deploy` needed `build`, and `build` needed
# nothing — so lint.yml and test.yml ran BESIDE this workflow rather than in front of it. A push
# whose tests failed still went to production as long as it compiled; the red tick arrived next
# to a green deploy. They are separate workflows and `needs:` cannot reach across workflows, so
# the only way to make the deploy wait is to run them here.
#
# They still run on their own for pull requests, where the duplication costs nothing and the
# feedback is the point. On a push to main the cost is one extra `npm ci` and a test run, which
# is the price of the deploy meaning something.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # the only real typecheck: the root tsconfig has `files: []`, so plain `tsc --noEmit`
      # checks nothing and passes on anything
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: verify
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # ⚠️ Plain `npm ci`, NOT `npm ci || npm i`.
      #
      # `npm ci` exists to verify that package-lock.json still matches package.json, and it is
      # the only thing checking that. Falling back to `npm i` turns that check into a shrug: on
      # lockfile drift it silently resolves different versions, rewrites the lock in CI, and
      # DEPLOYS the result. The one workflow that publishes to production was the one not
      # enforcing it, while build.yml — which ships nothing — used strict `npm ci`.
      #
      # Verified before removing: the lockfile is in sync (deps and devDeps both match), `npm ci`
      # succeeds locally, and build.yml already proves plain `npm ci` works in this CI. So the
      # fallback was dead weight that could only ever fire in the case worth knowing about.
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LEADERBOARD_TABLE: ${{ secrets.VITE_LEADERBOARD_TABLE }}
          VITE_LEADERBOARD_NAME_COLUMN: ${{ secrets.VITE_LEADERBOARD_NAME_COLUMN }}
          # Multiplayer WS endpoint (Render): set this secret to your wss:// service URL
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
