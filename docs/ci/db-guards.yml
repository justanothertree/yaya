# ⚠️ THIS FILE BELONGS AT .github/workflows/db-guards.yml AND IS PARKED HERE.
# GitHub refuses a push that creates or edits a workflow file unless the pushing credential
# holds the `workflow` scope, and the one I push with does not:
#
#     ! [remote rejected] main -> main (refusing to allow an OAuth App to create or update
#       workflow `.github/workflows/db-guards.yml` without `workflow` scope)
#
# So it is committed here instead of being silently dropped. To enable it, move it and push
# yourself -- or paste it into GitHub's web editor, which creates the file with your own scope:
#
#     git mv docs/ci/db-guards.yml .github/workflows/db-guards.yml && git commit && git push
#
# It will fail on its first run until a schema baseline exists; the reason, the one command that
# fixes it, and what has to happen to the 37 existing migrations are all in the first step below.
#
name: db guards

# Runs supabase/tests/visibility-guards.sql against a throwaway local database on every push.
#
# ⚠️ NO PRODUCTION CREDENTIALS ARE USED OR WANTED HERE. The database this builds is created by
# `supabase start`, lives for the length of the job and is thrown away. Giving Actions a
# connection string to the live project would make every workflow run a thing that can read
# members' data, which is a much larger decision than running a test.
#
# ⚠️ AND IT CANNOT PASS BY TESTING NOTHING. A freshly migrated database has no members, no admin
# and no logs, so every check that needs a session would succeed against an empty set and report
# a green zero. `supabase/seed.sql` supplies the fixtures, and the guard file refuses to run
# without them — see its block 0.

on:
  push:
  pull_request:
  workflow_dispatch:

# read-only: this job checks out code and talks to a local container, nothing else
permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ⚠️ THE REPOSITORY CANNOT CURRENTLY BUILD ITS OWN SCHEMA FROM SCRATCH, and this step says
      # so in one sentence rather than letting `db reset` fail three minutes later with
      # `relation "public.profiles" does not exist`. supabase/migrations holds the 37 changes
      # made since late October; the 283 before them live only in the live database, so nothing
      # here creates the tables the recent ones alter.
      #
      # ── GENERATING THE BASELINE ────────────────────────────────────────────────────────────
      #     supabase link --project-ref <ref>
      #     supabase db dump --linked -f supabase/migrations/00000000000000_baseline.sql
      #
      # ── AND WHAT THEN HAPPENS TO THE 37 ────────────────────────────────────────────────────
      # The dump is the schema AS IT IS TODAY, so it already contains everything those 37 did.
      # On a fresh database they replay on top of it, and most of them do not mind: 35 of the 37
      # are `create or replace function`, `add column if not exists`, `create ... if not exists`,
      # `drop ... if exists`, grants, revokes, or data updates that are no-ops on empty tables.
      #
      # ⚠️ EXACTLY TWO STATEMENTS IN ONE FILE WOULD FAIL, counted rather than guessed:
      # `20261030032833_suspension_reaches_the_social_tables.sql` has two bare `create policy`
      # statements, and a policy that already exists is an error rather than a no-op. (The
      # `create trigger` in `20261030134148_...` looks like a third and is not — it is preceded
      # by `drop trigger if exists`.)
      #
      # Two ways to resolve it, and they trade different things:
      #
      #   a) MAKE THOSE TWO IDEMPOTENT — add `drop policy if exists` above each `create policy`.
      #      Two lines. Keeps one migrations directory, keeps all 37 headers where they are, and
      #      the repo still builds. The cost is that this one file stops matching the statement
      #      recorded in `schema_migrations` byte for byte, which is a convention this project
      #      keeps deliberately; it would need a note in its own header saying what diverged and
      #      why. RECOMMENDED — the divergence is two lines and explainable, and squashing is
      #      not.
      #
      #   b) SQUASH — keep only the baseline and move the 37 into a subdirectory (the CLI reads
      #      `*.sql` in the migrations directory and ignores folders), or delete them. Clean
      #      directory; loses nothing from git history but takes the migration headers out of
      #      the place people look, and those headers are where this project keeps its reasoning.
      #
      # Either way the baseline must sort FIRST, hence the all-zero timestamp: `db reset` applies
      # files in filename order, so a baseline dated after the 37 would let them run first
      # against an empty database and fail exactly as today.
      - name: Check the migrations can build the schema
        run: |
          if ! grep -rqiE 'create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?("?public"?\.)?"?profiles"?([[:space:](]|$)' supabase/migrations/; then
            echo "::error title=No schema baseline::supabase/migrations cannot build this schema from scratch — nothing in it creates public.profiles, so the migrations that ALTER it will fail. Generate a baseline once: supabase db dump --linked -f supabase/migrations/00000000000000_baseline.sql (see this workflow's comments for what then happens to the 37 existing migrations)"
            exit 1
          fi

      # ⚠️ PINNED. `version: latest` means a CLI release can change what this job does without a
      # commit here, which is the same rot a floating dependency always is — and for a job whose
      # whole purpose is to notice changes, a moving part nobody chose is the wrong kind.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start a throwaway database
        run: supabase start

      # applies every migration in order, then supabase/seed.sql
      - name: Apply migrations and seed
        run: supabase db reset

      - name: Run the visibility guards
        run: |
          DB_URL="$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          # ON_ERROR_STOP turns the suite's own RAISE into a failed job
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/visibility-guards.sql

      - name: Stop the database
        if: always()
        run: supabase stop --no-backup || true
