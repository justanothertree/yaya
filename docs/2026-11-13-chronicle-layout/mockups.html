<!doctype html>
<html lang="en" data-theme="dark" style="--ui-scale: 1; --mnav-h: 60px">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronicle layout — mockups (not the app)</title>
    <!--
      MOCKUPS FOR A PROPOSAL, NOT PART OF THE APP. Nothing imports this file and the build does not
      include it. It borrows the site's own stylesheet so the screens look like the room, and adds
      the few pieces the proposal invents (the slim timer bar, one-line goal rows, bottom sheets).

      Open it through the dev server, at a phone width:
        npm run dev, then http://localhost:5173/docs/2026-11-13-chronicle-layout/mockups.html#day
      Screens: #day #day-idle #start #now-menu #aims #aims-row #journal #friends #stop
      Every control is inert. The data is the dev preview's.
    -->
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      body {
        margin: 0;
      }
      .mock-tag {
        position: fixed;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 900200;
        font: 700 10px/1 ui-monospace, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #0b0b12;
        background: #f5c060;
        padding: 3px 7px;
        border-radius: 999px;
        pointer-events: none;
      }

      /* the four halves, sized so "Aims 4" is never cut to "Ai…" */
      .mock .chron-halves {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.35rem;
      }
      .mock .chron-halves .btn {
        padding: 0.45rem 0.25rem;
        min-width: 0;
      }
      .mock .chron-halves small {
        display: none;
      }

      /* the slim timer bar: what is running, Stop, and a menu for the rest */
      .mock-now {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.7rem;
        margin: 0.7rem 0;
        border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
      }
      .mock-now-time {
        font: 700 1.25rem/1 ui-monospace, monospace;
      }
      .mock-now-what {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .mock-now-what strong {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mock-now-what small {
        color: var(--muted);
        font-size: 0.72rem;
      }
      .mock-bar {
        display: block;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .mock-bar b {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .mock-icon {
        min-width: 40px;
        min-height: 40px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
      }

      /* idle: one Start, and the three most recent as chips */
      .mock-start {
        margin: 0.7rem 0;
        display: grid;
        /* minmax(0, …), or the chips row's full width becomes the column's and the page scrolls */
        grid-template-columns: minmax(0, 1fr);
        gap: 0.5rem;
      }
      .mock-start-main {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
      }
      .mock-start-main .btn {
        min-height: 44px;
        font-weight: 700;
      }
      .mock-chips {
        min-width: 0;
        display: flex;
        gap: 0.4rem;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .mock-chips .btn {
        white-space: nowrap;
      }

      /* the day's head: which day, and the one number that says how it went */
      .mock-dayhead {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 0.4rem;
        margin: 0.4rem 0 0.2rem;
      }
      .mock-dayhead strong {
        text-align: center;
      }
      .mock-sum {
        width: 100%;
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.6rem 0.75rem;
        margin: 0.3rem 0 0.6rem;
        text-align: left;
      }
      .mock-sum .big {
        font-size: 1.5rem;
        font-weight: 800;
      }
      .mock-sum .rest {
        color: var(--muted);
        font-size: 0.8rem;
        flex: 1;
      }

      /* list rows: the row is the button, and a chevron says so */
      .mock-rows {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .mock-rows > li {
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .mock-row {
        width: 100%;
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 0.55rem;
        min-height: 44px;
        padding: 0.35rem 0.15rem;
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      .mock-row .what {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .mock-row .what span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mock-row .what small {
        color: var(--muted);
        font-size: 0.74rem;
      }
      .mock-row .len {
        font: 600 0.85rem ui-monospace, monospace;
      }
      .mock-row .chev {
        color: var(--muted);
      }
      .mock-moment {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 0.45rem 0.15rem;
      }

      /* goal rows: one line, one menu */
      .mock-goal {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.2rem 0.1rem;
      }
      .mock-goal .title {
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.3rem 0.4rem;
      }
      .mock-goal input {
        width: 24px;
        height: 24px;
        margin: 0;
      }
      .mock-meter {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        align-items: center;
        gap: 0.4rem;
        padding: 0 0.1rem 0.5rem 2rem;
      }
      .mock-meter .num {
        font: 600 0.78rem ui-monospace, monospace;
        color: var(--muted);
      }
      .mock-meter .btn {
        min-width: 36px;
        min-height: 36px;
        padding: 0;
      }
      .mock-done .title > span:first-child {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .mock-horizon {
        display: flex;
        gap: 0.35rem;
        margin: 0.4rem 0;
      }
      .mock-horizon .btn {
        flex: 1 1 auto;
        padding-inline: 0.4rem;
        white-space: nowrap;
      }
      .mock-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 0.6rem 0 0.3rem;
      }
      .mock-head h3,
      .mock-head h4 {
        margin: 0;
        font-size: 0.95rem;
      }
      .mock-head .muted {
        font-size: 0.78rem;
      }

      /* folded things: a row that opens, with what is inside it named */
      .mock-fold {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.4rem 0.6rem;
        margin-top: 0.4rem;
        text-align: left;
      }
      .mock-fold small {
        display: block;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 400;
      }

      /* bottom sheets — over the site's bottom bar, the way a real one would be */
      .has-sheet .mnav {
        visibility: hidden;
      }
      .mock-scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 900100;
      }
      .mock-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 900101;
        max-height: 82vh;
        overflow: auto;
        background: #14141f;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px 18px 0 0;
        padding: 0.5rem 1rem 1.2rem;
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.5);
      }
      .mock-sheet::before {
        content: '';
        display: block;
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.25);
        margin: 0 auto 0.6rem;
      }
      .mock-sheet h3 {
        margin: 0 0 0.6rem;
        font-size: 1.05rem;
      }
      .mock-sheet .mock-act {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-height: 48px;
        padding: 0 0.7rem;
        margin-bottom: 0.4rem;
        text-align: left;
        font-weight: 600;
      }
      .mock-sheet .mock-act small {
        margin-left: auto;
        color: var(--muted);
        font-weight: 400;
      }
      .mock-sheet .mock-danger {
        color: #f87171;
      }
      .mock-sheet .lbl {
        display: block;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0.7rem 0 0.4rem;
      }
      .mock-rate {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.35rem;
      }
      .mock-rate .btn {
        padding-inline: 0;
        min-height: 44px;
      }
      .mock-sheet textarea,
      .mock-sheet select,
      .mock-sheet input[type='search'] {
        width: 100%;
        box-sizing: border-box;
      }
      .mock-sheet-foot {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.5rem;
        margin-top: 0.8rem;
      }
      .mock-sheet-foot .btn {
        min-height: 46px;
        font-weight: 700;
      }
      .mock-feed h4 {
        margin: 0.8rem 0 0.4rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .mock-search {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.4rem;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="mock-tag">Mockup · proposal</div>
    <div id="root">
      <div>
        <nav class="nav">
          <div class="container nav-inner">
            <a class="brand" href="#">Evan Cook</a>
            <div class="nav-right">
              <div class="notif-wrap">
                <button class="notif-btn" aria-label="Notifications">
                  <span>🔔</span><span class="notif-dot">9</span>
                </button>
              </div>
            </div>
          </div>
        </nav>
        <main id="content" class="container">
          <section class="reveal reveal-in">
            <section class="card chron mock" id="screen"></section>
          </section>
        </main>
        <nav class="mnav">
          <button class="mnav-item"><span class="mnav-ic">🏠</span><span class="mnav-lbl">Home</span></button>
          <button class="mnav-item"><span class="mnav-ic">📡</span><span class="mnav-lbl">Feed</span></button>
          <button class="mnav-item"><span class="mnav-ic">🏆</span><span class="mnav-lbl">Circuit</span></button>
          <button class="mnav-item"><span class="mnav-ic">⭐</span><span class="mnav-lbl">Ratings</span></button>
          <button class="mnav-item">
            <span class="mnav-ic">💬</span><span class="mnav-lbl">Chat</span><span class="mnav-pip">2</span>
          </button>
          <button class="mnav-item">
            <span class="mnav-ic">☰</span><span class="mnav-lbl">Menu</span><span class="mnav-pip">1</span>
          </button>
        </nav>
      </div>
    </div>

    <!-- ─── shared pieces ─────────────────────────────────────────────────────────────────────── -->
    <template id="halves-day">
      <h2 class="section-title">Chronicle</h2>
      <div class="chron-halves">
        <button aria-pressed="true" class="btn is-on"><span class="chron-half-top"><span class="chron-half-name">Day</span></span></button>
        <button aria-pressed="false" class="btn btn-ghost"><span class="chron-half-top"><span class="chron-half-name">Aims</span><span class="chron-due">4<span class="sr-only"> not finished today</span></span></span></button>
        <button aria-pressed="false" class="btn btn-ghost"><span class="chron-half-top"><span class="chron-half-name">Journal</span></span></button>
        <button aria-pressed="false" class="btn btn-ghost"><span class="chron-half-top"><span class="chron-half-name">Friends</span></span></button>
      </div>
    </template>
    <template id="now">
      <div class="mock-now chron-m-now">
        <span class="mock-now-time" role="timer">10:48</span>
        <span class="mock-now-what"><strong>Drawing</strong><small>20m left of 30m</small><i class="mock-bar"><b style="width: 34%"></b></i></span>
        <button class="btn">■ Stop</button>
        <button class="btn btn-ghost mock-icon" aria-label="More: note, switch, new activity">⋯</button>
      </div>
    </template>
    <template id="daylog">
      <div class="mock-dayhead chron-m-day">
        <button class="btn btn-ghost mock-icon" aria-label="The day before">‹</button>
        <strong>Today</strong>
        <button class="btn btn-ghost mock-icon" aria-label="The day after">›</button>
      </div>
      <button class="btn btn-ghost mock-sum chron-m-sum" aria-expanded="false">
        <span class="big">44%</span><span class="rest">Locked In · 2h 44m written down · 1 on the site</span><span aria-hidden="true">▸</span>
      </button>
      <ul class="mock-rows chron-m-log">
        <li><button class="mock-row"><span class="chron-dot" style="background: rgb(139, 92, 246)"></span><span class="what"><span>Drawing</span><small>7:50 PM – now</small></span><span class="len">7m</span><span class="chev">›</span></button></li>
        <li><button class="mock-row"><span class="chron-dot" style="background: #9ca3af"></span><span class="what"><span>Dishes</span><small>6:10 PM</small></span><span class="len">12m</span><span class="chev">›</span></button></li>
        <li><button class="mock-row"><span class="chron-dot" style="background: #9ca3af"></span><span class="what"><span>Dishes</span><small>5:20 PM</small></span><span class="len">20m</span><span class="chev">›</span></button></li>
        <li class="mock-moment">★ Rated <strong>The Quiet Shore</strong> · film · 82</li>
        <li class="mock-moment">★ Rated <strong>Mistfall Hunter</strong> · game · 94</li>
        <li><button class="mock-row"><span class="chron-dot" style="background: rgb(139, 92, 246)"></span><span class="what"><span>Drawing</span><small>good · 📷</small></span><span class="len">35m</span><span class="chev">›</span></button></li>
        <li><button class="mock-row"><span class="chron-dot" style="background: rgb(76, 175, 80)"></span><span class="what"><span>Gym</span><small>60 reps · short · good</small></span><span class="len">45m</span><span class="chev">›</span></button></li>
        <li><button class="mock-row"><span aria-hidden="true">📝</span><span class="what"><span>Up late. Writing this down so tomorrow knows why.</span><small>12:05 AM</small></span><span class="len"></span><span class="chev">›</span></button></li>
        <li><button class="mock-row"><span class="chron-dot" style="background: rgb(61, 154, 229)"></span><span class="what"><span>Writing</span><small>from Thu · good · finished the chapter</small></span><span class="len">30m</span><span class="chev">›</span></button></li>
      </ul>
      <button class="btn btn-ghost mock-fold chron-m-fold">
        <span>This week<small>7% of these 6 days is written down</small></span><span aria-hidden="true">▸</span>
      </button>
      <button class="btn btn-ghost mock-fold chron-m-fold">
        <span>Plans, routines and activities<small>Planned 2h 30m · 2h 44m done</small></span><span aria-hidden="true">▸</span>
      </button>
    </template>

    <!-- ─── screens ───────────────────────────────────────────────────────────────────────────── -->
    <template id="tpl-day">
      <slot data-use="halves-day"></slot>
      <slot data-use="now"></slot>
      <slot data-use="daylog"></slot>
    </template>

    <template id="tpl-day-idle">
      <slot data-use="halves-day"></slot>
      <div class="mock-start chron-m-start">
        <div class="mock-start-main">
          <button class="btn">▶ Start something</button>
          <button class="btn btn-ghost mock-icon" aria-label="More: note, log a past session, new activity">⋯</button>
        </div>
        <div class="mock-chips">
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(139, 92, 246)"></span>Drawing</button>
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(76, 175, 80)"></span>Gym</button>
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(61, 154, 229)"></span>Writing</button>
        </div>
      </div>
      <slot data-use="daylog"></slot>
    </template>

    <template id="tpl-start">
      <slot data-use="halves-day"></slot>
      <div class="mock-start chron-m-start">
        <div class="mock-start-main">
          <button class="btn">▶ Start something</button>
          <button class="btn btn-ghost mock-icon" aria-label="More">⋯</button>
        </div>
      </div>
      <slot data-use="daylog"></slot>
      <div class="mock-scrim"></div>
      <div class="mock-sheet" role="dialog" aria-label="Start something">
        <h3>Start something</h3>
        <input type="search" placeholder="What are you doing?" aria-label="What are you doing?" />
        <span class="lbl">Your activities</span>
        <div class="mock-chips" style="flex-wrap: wrap">
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(139, 92, 246)"></span>Drawing</button>
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(76, 175, 80)"></span>Gym</button>
          <button class="btn btn-ghost chron-chip-start">Dishes</button>
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(61, 154, 229)"></span>Writing</button>
          <button class="btn btn-ghost chron-chip-start">▶ Writing the difficult chapter</button>
        </div>
        <span class="lbl">Or</span>
        <button class="btn btn-ghost mock-act">🕘 Log a past session<small>Log past</small></button>
        <button class="btn btn-ghost mock-act">✎ Write a note<small>no session needed</small></button>
        <button class="btn btn-ghost mock-act">＋ New activity</button>
      </div>
    </template>

    <template id="tpl-now-menu">
      <slot data-use="halves-day"></slot>
      <slot data-use="now"></slot>
      <slot data-use="daylog"></slot>
      <div class="mock-scrim"></div>
      <div class="mock-sheet" role="dialog" aria-label="Drawing, running">
        <h3>Drawing · 10:48</h3>
        <button class="btn btn-ghost mock-act">✎ Note<small>nothing written yet</small></button>
        <span class="lbl">Switch to</span>
        <div class="mock-chips" style="flex-wrap: wrap">
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(76, 175, 80)"></span>Gym</button>
          <button class="btn btn-ghost chron-chip-start">▶ Dishes</button>
          <button class="btn btn-ghost chron-chip-start"><span class="chron-dot" style="background: rgb(61, 154, 229)"></span>Writing</button>
          <button class="btn btn-ghost chron-chip-start">▶ Writing the difficult chapter</button>
        </div>
        <span class="lbl">Or</span>
        <button class="btn btn-ghost mock-act">＋ New activity</button>
      </div>
    </template>

    <template id="tpl-aims">
      <h2 class="section-title">Chronicle</h2>
      <div class="chron-halves">
        <button aria-pressed="false" class="btn btn-ghost"><span class="chron-half-top"><span class="chron-half-name">Day</span></span></button>
        <button aria-pressed="true" class="btn is-on"><span class="chron-half-top"><span class="chron-half-name">Aims</span><span class="chron-due">4<span class="sr-only"> not finished today</span></span></span></button>
        <button aria-pressed="false" class="btn btn-ghost"><span class="chron-half-top"><span class="chron-half-name">Journal</span></span></button>
        <button aria-pressed="false" class="btn btn-ghost"><span class="chron-half-top"><span class="chron-half-name">Friends</span></span></button>
      </div>
      <slot data-use="now"></slot>
      <div class="mock-horizon chron-m-strip" role="tablist" aria-label="How far ahead">
        <button role="tab" aria-selected="true" class="btn chron-tab is-on">Today<span class="chron-count">4</span></button>
        <button role="tab" aria-selected="false" class="btn chron-tab btn-ghost">Tomorrow<span class="chron-count">5</span></button>
        <button role="tab" aria-selected="false" class="btn chron-tab btn-ghost">Week<span class="chron-count">2</span></button>
        <button class="btn chron-tab btn-ghost" aria-label="Longer: this month, this year, years">More ▾</button>
      </div>
      <div class="mock-head">
        <h3>Fri, Nov 13 <span class="muted">· 4 left · about 10m</span></h3>
        <button class="btn">＋ Add</button>
      </div>
      <ul class="mock-rows chron-m-list">
        <li>
          <div class="mock-goal">
            <input type="checkbox" aria-label="Ring the dentist" />
            <span class="title"><span>Ring the dentist</span><span class="chron-chip is-pri is-now">urgent</span><span class="chron-chip is-est">~10m</span></span>
            <button class="btn btn-ghost mock-icon" aria-label="Ring the dentist: change, profile, delete">⋯</button>
          </div>
        </li>
        <li>
          <div class="mock-goal">
            <input type="checkbox" aria-label="Floss" />
            <span class="title"><span>Floss</span><span class="chron-chip">every day</span></span>
            <button class="btn btn-ghost mock-icon" aria-label="Floss: change, profile, delete">⋯</button>
          </div>
        </li>
        <li>
          <div class="mock-goal">
            <span aria-hidden="true" style="width: 24px"></span>
            <span class="title"><span>Swim on Tuesdays</span><span class="chron-chip">every day</span></span>
            <button class="btn btn-ghost mock-icon" aria-label="Swim on Tuesdays: change, profile, delete">⋯</button>
          </div>
          <div class="mock-meter chron-m-meter">
            <i class="mock-bar"><b style="width: 0%"></b></i><span class="num">0 / 20 min</span>
            <button class="btn btn-ghost" aria-label="One less">−</button><button class="btn btn-ghost" aria-label="One more">+</button>
          </div>
        </li>
        <li>

        </div>

        <button class="btn btn-ghost mock-act">More<small>times, activity, count, photo, delete ▸</small></button>

      </div>
    </template>

    <script>
      /* stamp the template the hash names, expanding <slot data-use> from the shared pieces */
      const stamp = (id) => {
        const tpl = document.getElementById(id)
        if (!tpl) return document.createDocumentFragment()
        const frag = tpl.content.cloneNode(true)
        for (const s of frag.querySelectorAll('slot[data-use]')) {
          const use = s.dataset.use
          s.replaceWith(stamp(use.startsWith('tpl-') ? use : use))
        }
        return frag
      }
      const show = () => {
        const name = (location.hash || '#day').slice(1)
        const screen = document.getElementById('screen')
        screen.replaceChildren(stamp('tpl-' + name))
        document.body.classList.toggle('has-sheet', !!screen.querySelector('.mock-sheet'))
        /* with nothing running, the newest sitting has an end */
        if (['day-idle', 'start', 'stop'].includes(name)) {
          const first = screen.querySelector('.mock-rows .mock-row')
          if (first) {
            first.querySelector('small').textContent = '7:50 PM – 8:01 PM · short'
            first.querySelector('.len').textContent = '11m'
          }
        }
        document.title = 'Chronicle mockup — ' + name
      }
      addEventListener('hashchange', show)
      show()
    </script>
